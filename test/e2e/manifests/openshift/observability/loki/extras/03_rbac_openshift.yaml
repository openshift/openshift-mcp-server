# Grant authenticated users read access to LokiStack tenants so kubeconfig-auth
# e2e (and local developers) can query via the gateway Route.
# For openshift-network mode, each tenant is a resource in loki.grafana.com.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: observability-lokistack-tenant-reader
rules:
  - apiGroups: ["loki.grafana.com"]
    resources: ["application", "infrastructure", "audit", "network"]
    resourceNames: ["logs"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: observability-lokistack-tenant-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: observability-lokistack-tenant-reader
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: system:authenticated
