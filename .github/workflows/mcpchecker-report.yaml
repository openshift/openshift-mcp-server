name: mcpchecker MCP Evaluation - Report

on:
  workflow_run:
    workflows: ["mcpchecker MCP Evaluation"]
    types: [completed]

permissions: {}

jobs:
  report:
    name: Post Evaluation Results
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'containers/kubernetes-mcp-server' && github.event.workflow_run.event == 'workflow_run'
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Checkout trusted default-branch reporter only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          path: report-source
          persist-credentials: false

      - name: Bind source run and artifact identities
        id: prepare
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            await require('./report-source/build/mcpchecker-artifacts.cjs').run({github, context, core, mode: 'prepare-report'});

      - name: Download separate source-bound data artifacts
        if: steps.prepare.outputs.artifact-ids != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ steps.prepare.outputs.artifact-ids }}
          merge-multiple: false
          path: ${{ steps.prepare.outputs.artifact-root }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate data and report API-bound current PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          ARTIFACT_PLAN: ${{ steps.prepare.outputs.artifact-plan }}
          ARTIFACT_ROOT: ${{ steps.prepare.outputs.artifact-root }}
        with:
          script: |
            await require('./report-source/build/mcpchecker-artifacts.cjs').run({github, context, core, mode: 'report'});
