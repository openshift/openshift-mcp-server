name: mcpchecker MCP Evaluation
run-name: mcpchecker source=${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || 0 }}

on:
  # Weekly schedule - runs every Monday at 9 AM UTC
  schedule:
    - cron: '0 9 * * 1'

  # PR evaluation trigger via review comments (chained from mcpchecker-trigger.yaml)
  workflow_run:
    workflows: ["mcpchecker MCP Evaluation - Trigger"]
    types: [completed]

  # Allow manual workflow dispatch for testing
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which task suite to run (core, helm, kubevirt, kiali, tekton, netobserv, argocd, or all)'
        required: false
        default: 'core'
        type: choice
        options:
          - core
          - helm
          - kubevirt
          - kiali
          - tekton
          - netobserv
          - argocd
          - all
      task-filter:
        description: 'Regular expression to filter tasks (optional)'
        required: false
        default: ''
      verbose:
        description: 'Enable verbose output'
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_run' && format('branch-{0}', github.event.workflow_run.head_branch) || github.ref }}
  cancel-in-progress: true

env:
  HARNESS_SHA: 'aa2cde6a978111cd162b79082084175bf5b0e820'
  MINIKUBE_PROFILE: mcp-eval-cluster

defaults:
  run:
    shell: bash

jobs:
  check-trigger:
    name: Check if evaluation should run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
    if: |
      github.repository == 'containers/kubernetes-mcp-server' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
      control-json: ${{ steps.check.outputs.control-json }}
      matrix: ${{ steps.check.outputs.matrix }}
      pr-number: ${{ steps.check.outputs.pr-number }}
      pr-sha: ${{ steps.check.outputs.pr-sha }}
      is-pr: ${{ steps.check.outputs.is-pr }}
      baseline: ${{ steps.check.outputs.baseline }}
      source-repository: ${{ steps.check.outputs.source-repository }}
    steps:
      - name: Require independently reviewed literal harness pin
        run: |
          [[ "$HARNESS_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'Reviewed harness pin is not finalized'; exit 1; }
      - name: Checkout control harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: redhat-chai-bot/openshift_openshift-mcp-server
          ref: 'aa2cde6a978111cd162b79082084175bf5b0e820'
          path: control-trusted
          persist-credentials: false
      - name: Check trigger conditions
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          INPUT_SUITE: ${{ inputs.suite }}
        with:
          script: |
            const control = require('./control-trusted/build/mcpchecker-control.cjs');
            await control.run({github, context, core});

  candidate-build:
    name: Build Candidate
    needs: check-trigger
    if: needs.check-trigger.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout build harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: redhat-chai-bot/openshift_openshift-mcp-server
          ref: 'aa2cde6a978111cd162b79082084175bf5b0e820'
          path: trusted-build
          persist-credentials: false
      - name: Checkout candidate only for compilation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ needs.check-trigger.outputs.source-repository }}
          ref: ${{ needs.check-trigger.outputs.pr-sha }}
          path: candidate
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - name: Setup fixed Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.4'
          cache: false
      - name: Compile untrusted candidate with fixed recipe
        timeout-minutes: 15
        env:
          CANDIDATE_SHA: ${{ needs.check-trigger.outputs.pr-sha }}
          SOURCE_REPOSITORY: ${{ needs.check-trigger.outputs.source-repository }}
        run: |
          export CANDIDATE_DIRECTORY="$GITHUB_WORKSPACE/candidate"
          export ARTIFACT_DIRECTORY="$RUNNER_TEMP/candidate-artifact"
          bash "$GITHUB_WORKSPACE/trusted-build/build/mcpchecker-candidate.sh" build
      - name: Upload candidate binary
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mcpchecker-candidate-server
          path: |
            ${{ runner.temp }}/candidate-artifact/kubernetes-mcp-server
            ${{ runner.temp }}/candidate-artifact/metadata.json
          if-no-files-found: error
          retention-days: 1

  run-evaluation:
    name: 'Run MCP Evaluation (${{ matrix.suite }})'
    needs: [check-trigger, candidate-build]
    if: needs.check-trigger.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: mcpchecker-reviewed
      url: ${{ format('https://github.com/{0}/commit/{1}', needs.check-trigger.outputs.source-repository, needs.check-trigger.outputs.pr-sha) }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check-trigger.outputs.matrix) }}
    env:
      CONTROL_JSON: ${{ needs.check-trigger.outputs.control-json }}
      MINIKUBE_DRIVER: ${{ contains(matrix.toolsets, 'kubevirt') && 'docker' || 'podman' }}
    steps:
      - name: Display exact privileged execution approval subject
        env:
          CANDIDATE_SHA: ${{ needs.check-trigger.outputs.pr-sha }}
          SUITE: ${{ matrix.suite }}
        run: |
          printf 'Protected approval required for whole candidate C=%s, reviewed H=%s, suite=%s. Same-account execution is NOT a sandbox; do not approve if this risk is unacceptable.\n' "$CANDIDATE_SHA" "$HARNESS_SHA" "$SUITE"
          [[ "$HARNESS_SHA" =~ ^[a-f0-9]{40}$ ]]
      - name: Checkout independently reviewed harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: redhat-chai-bot/openshift_openshift-mcp-server
          ref: 'aa2cde6a978111cd162b79082084175bf5b0e820'
          path: trusted
          persist-credentials: false
      - name: Validate candidate artifact origin
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          CANDIDATE_ARTIFACT_ID: ${{ needs.candidate-build.outputs.artifact-id }}
        with:
          script: |
            await require('./trusted/build/mcpchecker-control.cjs').run({github, context, core, mode: 'artifact'});
      - name: Download same-run candidate binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.candidate-build.outputs.artifact-id }}
          path: ${{ runner.temp }}/candidate-artifact
      - name: Validate binary-only artifact and bind source
        env:
          CANDIDATE_SHA: ${{ needs.check-trigger.outputs.pr-sha }}
          SOURCE_REPOSITORY: ${{ needs.check-trigger.outputs.source-repository }}
        run: |
          export TRUSTED_DIRECTORY="$GITHUB_WORKSPACE/trusted"
          export ARTIFACT_DIRECTORY="$RUNNER_TEMP/candidate-artifact"
          bash "$GITHUB_WORKSPACE/trusted/build/mcpchecker-candidate.sh" verify
      - name: Setup trusted Go toolchain without cache
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.4'
          cache: false
      - name: Setup Minikube cluster
        timeout-minutes: 15
        run: make -C trusted minikube-create-cluster MINIKUBE_PROFILE="$MINIKUBE_PROFILE"
      - name: Install CSI hostPath driver (resize-capable StorageClass)
        timeout-minutes: 10
        run: make -C trusted csi-hostpath-install
      - name: Install Istio/Kiali and bookinfo demo
        if: contains(matrix.toolsets, 'kiali')
        timeout-minutes: 20
        run: make -C trusted setup-kiali
      - name: Install KubeVirt
        if: contains(matrix.toolsets, 'kubevirt')
        timeout-minutes: 15
        run: make -C trusted kubevirt-install
      - name: Install Tekton
        if: contains(matrix.toolsets, 'tekton')
        timeout-minutes: 10
        run: make -C trusted tekton-install
      - name: Install NetObserv mock plugin
        if: contains(matrix.toolsets, 'netobserv')
        timeout-minutes: 10
        run: make -C trusted setup-netobserv
      - name: Install ArgoCD CRDs
        if: contains(matrix.toolsets, 'argocd')
        timeout-minutes: 10
        run: make -C trusted argocd-install
      - name: Revalidate live candidate and review immediately before launch
        id: revalidate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            await require('./trusted/build/mcpchecker-control.cjs').run({github, context, core, mode: 'revalidate'});
      - name: Start candidate with trusted configs and no model credentials
        id: server
        timeout-minutes: 3
        env:
          TOOLSETS: ${{ matrix.toolsets }}
          MCP_CONFIG_DIR: dev/config/mcp-configs
        run: make -C trusted -o build run-server
      - name: Run mcpchecker evaluation
        id: mcpchecker
        uses: ./trusted/.github/actions/mcpchecker-action
        with:
          eval-config: ${{ matrix.eval-config }}
          expected-results-file: ${{ matrix.expected-results-file }}
          mcpchecker-version: v0.0.22
          task-filter: ${{ inputs.task-filter || '' }}
          output-format: json
          verbose: ${{ inputs.verbose || 'false' }}
          upload-artifacts: 'true'
          artifact-name: mcpchecker-results-${{ matrix.suite }}
          fail-on-error: 'false'
          task-pass-threshold: '0.8'
          assertion-pass-threshold: '0.8'
          working-directory: trusted
        env:
          MODEL_BASE_URL: ${{ secrets.MODEL_BASE_URL }}
          MODEL_KEY: ${{ secrets.MODEL_KEY }}
          JUDGE_BASE_URL: ${{ secrets.JUDGE_BASE_URL }}
          JUDGE_API_KEY: ${{ secrets.JUDGE_API_KEY }}
          JUDGE_MODEL_NAME: ${{ secrets.JUDGE_MODEL_NAME }}
      - name: Fetch exact baseline as data
        id: baseline
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          SUITE: ${{ matrix.suite }}
        with:
          script: |
            await require('./trusted/build/mcpchecker-control.cjs').run({github, context, core, mode: 'baseline'});
      - name: Run exact-result diff
        id: mcpchecker-diff
        if: steps.baseline.outputs.has-diff == 'true'
        uses: ./trusted/.github/actions/mcpchecker-diff-action
        with:
          base-results: ${{ steps.baseline.outputs.base-results }}
          current-results: ${{ steps.mcpchecker.outputs.results-file }}
          mcpchecker-version: v0.0.22
          working-directory: trusted
      - name: Save typed evaluation context and enforce required final gate
        id: final-gate
        if: always()
        timeout-minutes: 2
        env:
          SUITE: ${{ matrix.suite }}
          EVAL_OUTCOME: ${{ steps.mcpchecker.outcome }}
          EVAL_PASSED: ${{ steps.mcpchecker.outputs.passed }}
          CHECK_EXIT: ${{ steps.mcpchecker.outputs.check-exit }}
          SUMMARY_EXIT: ${{ steps.mcpchecker.outputs.summary-exit }}
          VERIFY_EXIT: ${{ steps.mcpchecker.outputs.verify-exit }}
          SETUP_VERSION: ${{ steps.mcpchecker.outputs.mcpchecker-version }}
          SETUP_CHECKER: ${{ steps.mcpchecker.outputs.mcpchecker-path }}
          SETUP_AGENT: ${{ steps.mcpchecker.outputs.agent-path }}
          RESULTS_FILE: ${{ steps.mcpchecker.outputs.results-file }}
          SERVER_OUTCOME: ${{ steps.server.outcome }}
          REVALIDATE_OUTCOME: ${{ steps.revalidate.outcome }}
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
          HAS_DIFF: ${{ steps.baseline.outputs.has-diff }}
          DIFF_REASON: ${{ steps.baseline.outputs.reason }}
          DIFF_OUTCOME: ${{ steps.mcpchecker-diff.outcome }}
          DIFF_EXIT: ${{ steps.mcpchecker-diff.outputs.exit-code }}
          DIFF_DIRECTORY: ${{ steps.mcpchecker-diff.outputs.diagnostics-path }}
          TASKS_PASSED: ${{ steps.mcpchecker.outputs.tasks-passed }}
          TASKS_TOTAL: ${{ steps.mcpchecker.outputs.tasks-total }}
          TASK_PASS_RATE: ${{ steps.mcpchecker.outputs.task-pass-rate }}
          ASSERTIONS_PASSED: ${{ steps.mcpchecker.outputs.assertions-passed }}
          ASSERTIONS_TOTAL: ${{ steps.mcpchecker.outputs.assertions-total }}
          ASSERTION_PASS_RATE: ${{ steps.mcpchecker.outputs.assertion-pass-rate }}
        run: |
          export CONTEXT_DIRECTORY="$RUNNER_TEMP/eval-context-${SUITE}"
          bash "$GITHUB_WORKSPACE/trusted/build/mcpchecker-workflow-status.sh"
      - name: Upload PR context
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: eval-context-${{ matrix.suite }}
          path: ${{ runner.temp }}/eval-context-${{ matrix.suite }}
          retention-days: 1
          if-no-files-found: error
      - name: Cleanup trusted services and disposable cluster
        if: always()
        timeout-minutes: 10
        run: |
          status=0
          make -C trusted stop-server || status=1
          make -C trusted stop-netobserv || status=1
          make -C trusted teardown-netobserv || status=1
          make -C trusted minikube-delete-cluster MINIKUBE_PROFILE="$MINIKUBE_PROFILE" || status=1
          exit "$status"

  # Create PR with results (scheduled runs only)
  commit-results:
    name: Commit Evaluation Results
    timeout-minutes: 10
    needs: [check-trigger, run-evaluation]
    # Only commit results on scheduled runs. Use != 'cancelled' so partial
    # results from passing suites are still committed when some matrix jobs fail.
    if: always() && github.event_name == 'schedule' && needs.check-trigger.result == 'success' && needs.check-trigger.outputs.should-run == 'true' && needs.run-evaluation.result != 'cancelled' && needs.run-evaluation.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main

      - name: Bind scheduled source run and artifacts
        id: scheduled-data
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          CONTROL_JSON: ${{ needs.check-trigger.outputs.control-json }}
        with:
          script: |
            await require('./build/mcpchecker-artifacts.cjs').run({github, context, core, mode: 'prepare-schedule'});

      - name: Download mcpchecker results
        if: steps.scheduled-data.outputs.artifact-ids != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ steps.scheduled-data.outputs.artifact-ids }}
          merge-multiple: false
          path: ${{ steps.scheduled-data.outputs.artifact-root }}

      - name: Copy results to evals/results
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          ARTIFACT_PLAN: ${{ steps.scheduled-data.outputs.artifact-plan }}
          ARTIFACT_ROOT: ${{ steps.scheduled-data.outputs.artifact-root }}
          CONTROL_JSON: ${{ needs.check-trigger.outputs.control-json }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            fs.mkdirSync('evals/results', {recursive: true});
            process.env.RESULTS_DIRECTORY = path.join(process.env.GITHUB_WORKSPACE, 'evals/results');
            await require('./build/mcpchecker-artifacts.cjs').run({github, context, core, mode: 'schedule'});

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIGGER: ${{ github.event_name }}
          COMMIT_SHA: ${{ needs.check-trigger.outputs.pr-sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BRANCH="chore/update-eval-results"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create or reset the branch
          git checkout -B "$BRANCH"
          git add evals/results/*-latest.json

          # Skip if no changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore(evals): update mcpchecker evaluation results"
          git push -f origin "$BRANCH"

          # Check if PR already exists
          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' || echo "")

          PR_BODY=$(cat <<EOF
          ## Automated Evaluation Results Update

          This PR updates the mcpchecker evaluation results from the weekly scheduled run.

          **Run details:**
          - Trigger: $TRIGGER
          - Commit: $COMMIT_SHA
          - Workflow run: $RUN_URL

          ---
          This PR was automatically generated by the mcpchecker workflow.
          EOF
          )

          if [ -n "$EXISTING_PR" ]; then
            echo "Updating existing PR #$EXISTING_PR"
            gh pr edit "$EXISTING_PR" --body "$PR_BODY"
          else
            echo "Creating new PR"
            gh pr create \
              --title "chore: update mcpchecker evaluation results" \
              --body "$PR_BODY" \
              --base main \
              --head "$BRANCH"
          fi
