apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/openshift/openshift-mcp-server?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "push" && (target_branch
      == "main" || target_branch.matches("^release-.*"))
    pipelinesascode.tekton.dev/target-namespace: "ocp-mcp-server-tenant"
  labels:
    appstudio.openshift.io/application: mcp-server-main
    appstudio.openshift.io/component: openshift-mcp-server-main
    pipelines.appstudio.openshift.io/type: build
  name: openshift-mcp-server-main-on-push
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads/ocp-mcp-server-tenant/openshift-mcp-server-main:{{revision}}
  - name: build-platforms
    value:
    - linux/x86_64
    - linux/arm64
    - linux/ppc64le
    - linux/s390x
  - name: dockerfile
    value: Dockerfile.ocp
  pipelineRef:
    name: openshift-mcp-server-build-pipeline
  taskRunTemplate:
    serviceAccountName: build-pipeline-openshift-mcp-server-main
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
