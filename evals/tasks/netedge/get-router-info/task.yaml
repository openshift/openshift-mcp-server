kind: Task
metadata:
  name: get-router-info
  labels:
    suite: netedge
    project: haproxy
  annotations:
    project-name: "HAProxy"
    project-url: "https://www.haproxy.org/"
steps:
  verify:
    contains: "Name: HAProxy"
  prompt:
    inline: Retrieve and display HAProxy runtime information and statistics from the OpenShift router.
  assertions:
    toolsUsed:
      - server: kubernetes
        toolPattern: "get_router_info"
