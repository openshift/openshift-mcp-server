kind: Task
metadata:
  name: get-router-sessions
  labels:
    suite: netedge
    project: haproxy
  annotations:
    project-name: "HAProxy"
    project-url: "https://www.haproxy.org/"
steps:
  verify:
    contains: "frontend=GLOBAL"
  prompt:
    inline: Retrieve and display all active sessions from the OpenShift router.
  assertions:
    toolsUsed:
      - server: kubernetes
        toolPattern: "get_router_sessions"
