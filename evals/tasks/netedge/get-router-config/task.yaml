kind: Task
metadata:
  name: get-router-config
  labels:
    suite: netedge
    project: haproxy
  annotations:
    project-name: "HAProxy"
    project-url: "https://www.haproxy.org/"
steps:
  verify:
    contains: "frontend public"
  prompt:
    inline: Retrieve and display the current HAProxy configuration from the OpenShift router.
  assertions:
    toolsUsed:
      - server: kubernetes
        toolPattern: "get_router_config"
