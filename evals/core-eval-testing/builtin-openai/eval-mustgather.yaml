kind: Eval
metadata:
  name: "mustgather-e2e"
config:
  agent:
    type: "file"
    path: agent.yaml
  mcpConfigFile: ../../mcp-config.yaml
  extensions:
    kubernetes:
      package: https://github.com/mcpchecker/kubernetes-extension@v0.0.4
  llmJudge:
    ref:
      type: file
      path: agent.yaml
  taskSets:
    - glob: ../../tasks/*/*/*.yaml
      labelSelector:
        suite: mustgather
      assertions:
        toolsUsed:
          - server: kubernetes
            toolPattern: "mustgather_.*"
        minToolCalls: 1
        maxToolCalls: 15
